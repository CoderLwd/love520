<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>520 专属礼物</title>
  <!-- 引入好看的中文字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 柔和配色方案 */
      --primary-color: #ffb7b2; /* 柔和粉 */
      --secondary-color: #ffdac1; /* 奶油橘 */
      --accent-color: #e2f0cb; /* 淡绿 */
      --text-main: #6d6d6d;
      --text-highlight: #ff9aa2;
      --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #fff0f5; /* 薰衣草红 blush */
      background-image: linear-gradient(to top, #fff0f5 0%, #ffe6fa 100%);
      font-family: 'Noto Sans SC', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    h1, h2, h3, .hand-font {
      font-family: 'Ma Shan Zheng', cursive;
    }

    /* --- 开场遮罩 --- */
    .unbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #fff5f7 0%, #ffe3e8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease, visibility 1s;
      cursor: pointer;
    }

    .gift-box {
      width: 150px;
      height: 150px;
      position: relative;
      animation: breathe 3s infinite ease-in-out;
      filter: drop-shadow(0 10px 15px rgba(255, 105, 180, 0.3));
    }

    .box-top {
      width: 160px;
      height: 40px;
      background: var(--primary-color);
      border-radius: 8px;
      position: absolute;
      top: -20px;
      left: -5px;
      z-index: 2;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .box-body {
      width: 150px;
      height: 130px;
      background: #ff9aa2;
      border-radius: 8px;
      position: absolute;
      bottom: 0;
      z-index: 1;
    }

    .ribbon {
      position: absolute;
      width: 20px;
      height: 100%;
      background: #fff;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      opacity: 0.9;
    }
    
    .ribbon-h {
      position: absolute;
      width: 100%;
      height: 20px;
      background: #fff;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      opacity: 0.9;
    }

    .click-tip {
      margin-top: 40px;
      font-size: 18px;
      color: #ff9aa2;
      letter-spacing: 2px;
      animation: tipBlink 2s infinite;
      font-family: 'Ma Shan Zheng', cursive;
    }

    /* --- 主内容 --- */
    .content {
      display: none;
      padding: 40px 20px 80px;
      max-width: 800px;
      margin: 0 auto;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .header-section {
      text-align: center;
      margin-bottom: 50px;
    }

    .title {
      font-size: 42px;
      color: #ff8fa3;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(255, 183, 178, 0.3);
    }

    .type-text {
      font-size: 18px;
      color: #888;
      min-height: 24px; /* 防止抖动 */
      line-height: 1.6;
    }

    /* 恋爱倒计时 - 卡片风格 */
    .count-box {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      margin-bottom: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
    }
    
    .count-box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    .count-title {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    
    .count-num {
      font-size: 48px;
      color: #ff8fa3;
      font-weight: bold;
      font-family: 'Ma Shan Zheng', cursive;
      margin: 10px 0;
    }

    /* 情话翻转卡片 */
    .card-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    
    .card {
      height: 140px;
      perspective: 1000px;
      cursor: pointer;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    .card.active .card-inner {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.4;
    }
    
    .card-front {
      background: linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%);
      color: #fff;
      font-weight: bold;
    }
    
    .card-back {
      background: #fff;
      color: #ff8fa3;
      transform: rotateY(180deg);
      border: 2px solid #ffe3e8;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 18px;
    }

    /* 照片墙 */
    .photo-wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    
    .photo-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(30px);
      background: #fff;
      padding: 8px; /* 拍立得边框效果 */
      cursor: pointer;
    }
    
    .photo-item:nth-child(n) { 
      animation: fadeUp 1s calc(0.1s * var(--i)) forwards; 
    }
    
    .photo-item:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 30px rgba(255, 143, 163, 0.2);
    }
    
    .photo {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      transition: all 0.4s ease;
    }

    .photo:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 30px rgba(255, 143, 163, 0.2);
    }

    /* 灯箱 */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .lightbox.show {
      opacity: 1;
    }
    
    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s;
    }
    
    .lightbox.show img {
      transform: scale(1);
    }

    /* 音乐控制按钮 */
    .music-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      transition: transform 0.3s;
      border: 2px solid #ffe3e8;
    }
    
    .music-btn.playing {
      animation: spin 4s linear infinite;
    }
    
    .music-icon {
      width: 24px;
      height: 24px;
      fill: #ff8fa3;
    }

    /* 点击产生的爱心 */
    .click-heart {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      font-size: 20px;
      z-index: 9999;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes tipBlink {
      0%, 100% { opacity: 0.6; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-5px); }
    }
    @keyframes boxOpen {
      0% { top: -20px; opacity: 1; }
      100% { top: -120px; opacity: 0; }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>

<body>
  <!-- 背景音乐 (请替换 src 为你的音乐文件地址，例如 './love.mp3') -->
  <audio id="bgMusic" loop>
    <source src="https://music.163.com/song/media/outer/url?id=1824045033.mp3" type="audio/mpeg">
  </audio>

  <!-- 音乐按钮 -->
  <div class="music-btn" id="musicBtn" title="播放/暂停音乐">
    <svg class="music-icon" viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </div>

  <!-- 开箱礼盒 -->
  <div class="unbox" id="unbox">
    <div class="gift-box" id="giftBox">
      <div class="box-top" id="boxTop"></div>
      <div class="box-body">
        <div class="ribbon"></div>
        <div class="ribbon-h"></div>
      </div>
    </div>
    <div class="click-tip">💖 点击开启惊喜 💖</div>
  </div>

  <!-- 主内容页 -->
  <div class="content" id="content">
    <div class="header-section">
      <h1 class="title">Happy 520</h1>
      <p class="type-text" id="typewriter"></p>
    </div>

    <!-- 恋爱计时 -->
    <div class="count-box">
      <div class="count-title">我们已经相爱</div>
      <div class="count-num" id="dayCount">0</div>
      <div class="count-title">天 · 每一秒都珍贵</div>
    </div>

    <!-- 情话翻转卡片 -->
    <div class="card-wrap">
      <div class="card">
        <div class="card-inner">
          <div class="card-front">✨ 第一句</div>
          <div class="card-back">山野千里<br>你是人间星光</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">🌸 第二句</div>
          <div class="card-back">岁岁年年<br>万喜万般宜</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">🍃 第三句</div>
          <div class="card-back">风吹十里<br>不如一直有你</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">💌 第四句</div>
          <div class="card-back">愿余生<br>朝朝暮暮都是你</div>
        </div>
      </div>
    </div>

    <!-- 照片墙 -->
    <div class="photo-wall">
      <!-- 替换 src 为真实照片 -->
      <div class="photo-item" style="--i:1"><img src="./resource/1.JPEG" class="photo"></div>
      <div class="photo-item" style="--i:2"><img src="./resource/2.JPEG" class="photo"></div>
      <div class="photo-item" style="--i:3"><img src="./resource/3.PNG" class="photo"></div>
      <div class="photo-item" style="--i:4"><img src="./resource/4.JPEG" class="photo"></div>
      <div class="photo-item" style="--i:5"><img src="./resource/5.JPEG" class="photo"></div>
      <div class="photo-item" style="--i:6"><img src="./resource/6.JPEG" class="photo"></div>
      <div class="photo-item" style="--i:7"><img src="./resource/7.PNG" class="photo"></div>
      <div class="photo-item" style="--i:8"><img src="./resource/10.JPEG" class="photo"></div>
      <div class="photo-item" style="--i:9"><img src="./resource/11.JPEG" class="photo"></div>
    </div>
  </div>

  <!-- 照片放大灯箱 -->
  <div class="lightbox" id="lightbox">
    <img src="" id="lightImg">
  </div>

  <!-- 背景飘落爱心 -->
  <canvas id="heartCanvas"></canvas>

  <script>
    // 1. 开箱逻辑
    const unbox = document.getElementById("unbox");
    const giftBox = document.getElementById("giftBox");
    const boxTop = document.getElementById("boxTop");
    const content = document.getElementById("content");
    const bgMusic = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");
    let opened = false;

    unbox.addEventListener("click", () => {
      if (opened) return;
      opened = true;
      
      // 尝试播放音乐
      bgMusic.play().then(() => {
        musicBtn.classList.add('playing');
      }).catch(e => console.log("自动播放被拦截，需手动点击音乐按钮"));

      giftBox.style.animation = "none";
      boxTop.style.animation = "boxOpen 1s ease forwards";

      setTimeout(() => {
        unbox.style.opacity = "0";
        unbox.style.visibility = "hidden";
        content.style.display = "block";
        
        // 触发内容淡入
        setTimeout(() => {
          content.style.opacity = "1";
          startTypewriter(); // 开始打字效果
        }, 100);
      }, 1200);
    });

    // 2. 音乐控制
    musicBtn.addEventListener("click", (e) => {
      e.stopPropagation(); // 防止触发点击爱心
      if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.classList.add('playing');
      } else {
        bgMusic.pause();
        musicBtn.classList.remove('playing');
      }
    });

    // 3. 恋爱天数计算 【修改这里的日期】
    function getLoveDays() {
      // 格式：年, 月(0-11), 日
      const start = new Date(2017, 4, 20); 
      const now = new Date();
      const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
      document.getElementById("dayCount").innerText = diff;
    }
    getLoveDays();

    // 4. 打字机效果
    function startTypewriter() {
      const text = "何其有幸，年岁并进，往后余生皆是你 ✨";
      const el = document.getElementById("typewriter");
      let i = 0;
      el.innerText = "";
      function type() {
        if (i < text.length) {
          el.innerText += text.charAt(i);
          i++;
          setTimeout(type, 100);
        }
      }
      type();
    }

    // 5. 卡片翻转
    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        card.classList.toggle("active");
      });
    });

    // 6. 照片灯箱
    const lightbox = document.getElementById("lightbox");
    const lightImg = document.getElementById("lightImg");
    document.querySelectorAll(".photo").forEach(img => {
      img.addEventListener("click", () => {
        lightImg.src = img.src;
        lightbox.style.display = "flex";
        setTimeout(() => lightbox.classList.add('show'), 10);
      });
    });
    lightbox.addEventListener("click", () => {
      lightbox.classList.remove('show');
      setTimeout(() => lightbox.style.display = "none", 300);
    });

    // 7. 点击屏幕产生爱心特效
    document.addEventListener("click", (e) => {
      // 排除掉卡片、照片、按钮等交互元素
      if (e.target.closest('.card') || e.target.closest('.photo') || e.target.closest('.music-btn') || e.target.closest('.unbox')) return;
      
      const heart = document.createElement("div");
      heart.className = "click-heart";
      heart.innerHTML = ["❤️", "💖", "💕", "🌸"][Math.floor(Math.random() * 4)];
      heart.style.left = e.clientX + "px";
      heart.style.top = e.clientY + "px";
      document.body.appendChild(heart);
      
      setTimeout(() => heart.remove(), 1000);
    });

    // 8. 背景 Canvas 爱心雨 (优化版)
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");
    
    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    class HeartParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height - height;
        this.size = Math.random() * 15 + 5;
        this.speed = Math.random() * 1 + 0.5;
        this.opacity = Math.random() * 0.5 + 0.1;
        this.color = `rgba(255, ${150 + Math.random()*50}, ${180 + Math.random()*50}, ${this.opacity})`;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * Math.PI / 180);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        // 绘制心形路径
        let s = this.size;
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-s/2, -s/2, -s, s/3, 0, s);
        ctx.bezierCurveTo(s, s/3, s/2, -s/2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.y += this.speed;
        this.rotation += this.rotationSpeed;
        if (this.y > height + 50) this.reset();
      }
    }

    const particles = Array(40).fill().map(() => new HeartParticle());
    
    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.draw(); p.update(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
